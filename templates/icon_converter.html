{% extends "base.html" %}

{% block title %}تحويل صورة إلى أيقونة | أدوات أونلاين{% endblock %}

{% block content %}
  <div class="text-center mb-4">
    <a href="/" class="btn btn-outline-primary">← رجوع للرئيسية</a>
  </div>

  <h2 class="text-center mb-4" style="color:#4b2995; font-weight:700;">
    🖼️ تحويل صورة إلى أيقونة (.ico)
  </h2>

  <form method="post" enctype="multipart/form-data" class="text-center">
    <label for="image" class="d-block mb-3" style="cursor:pointer; font-weight:600; color:#764ba2;">
      <i class="fas fa-file-image" style="font-size:3rem;"></i><br>
      اختر صورة PNG أو JPG
    </label>
    <input type="file" name="image" id="image" accept="image/*" required style="display:none;" />
    
    <!-- مكان عرض الصورة -->
    <div id="preview" class="mt-3"></div>

    <button type="submit" class="btn btn-primary w-100 mt-4" style="padding:14px 0; font-size:1.1rem;">
      🔄 تحويل إلى أيقونة
    </button>
  </form>

  {% if icon_url %}
    <div class="text-center mt-4">
      <h5>✅ تم التحويل بنجاح</h5>
      <a href="{{ icon_url }}" download="icon.ico" class="btn btn-success mt-2">⬇️ تحميل الأيقونة</a>
    </div>
  {% endif %}

  <!-- JavaScript لعرض الصورة -->
  <script>
    const imageInput = document.getElementById('image');
    const previewDiv = document.getElementById('preview');

    imageInput.addEventListener('change', function () {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          previewDiv.innerHTML = `<img src="${e.target.result}" alt="صورة المعاينة" style="max-width:150px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.15);">`;
        };
        reader.readAsDataURL(file);
      }
    });
  </script>
{% endblock %}
